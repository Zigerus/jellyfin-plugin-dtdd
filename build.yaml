overview: "Per-user content warnings driven by doesthedogdie.com"
description: >
  Surfaces a Safe / Not Safe badge on the Jellyfin item detail page,
  driven by doesthedogdie.com data and the user's configured phobia list.
  Each Jellyfin user picks their own phobia topics; the verdict is
  computed per user, with a strict threshold (any single YES vote on
  any of the user's phobias = Not Safe).
category: "General"
owner: "Zigerus"
artifacts:
- "Jellyfin.Plugin.Dtdd.dll"
changelog: >
  v0.2: DTDD API v3 migration — exact IMDB/TMDB lookup ladder resolves
  titles v1 fuzzy search could not, and the topic catalog now seeds in one
  pass from the v3 catalog endpoint (all topics categorized). Badges gained
  a details view: hover lists matched phobias one per line, selecting the
  badge opens a dialog with community yes/no vote counts. Badges are now
  reachable by TV-remote arrow keys, and the remote Back button closes
  plugin dialogs instead of navigating away from the item page.
