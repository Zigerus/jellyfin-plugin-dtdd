framework: "net9.0"
overview: "Per-user content warnings driven by doesthedogdie.com"
description: >
  Surfaces a Safe / Not Safe badge on the Jellyfin item detail page,
  driven by doesthedogdie.com data and the user's configured phobia list.
  Each Jellyfin user picks their own phobia topics; the verdict is
  computed per user, with a strict threshold (any single YES vote on
  any of the user's phobias = Not Safe).
category: "General"
owner: "Zigerus"
artifacts:
- "Jellyfin.Plugin.Dtdd.dll"
changelog: >
  v0.2.1: Fixes the "Save phobias" library scan, which stopped almost as soon
  as it started — the background warm was tied to the HTTP request that
  triggered it, so it was cancelled the moment that request completed and only
  ever processed an item or two. It now runs to completion, so badges populate
  after saving instead of waiting for the weekly task (which is off by
  default). Also fixes plugin loading on Jellyfin 10.11.0 through 10.11.7: the
  build referenced 10.11.8 while declaring compatibility from 10.11.0, so the
  catalog offered it to servers it could not actually load on. It is now built
  against the 10.11.0 floor and loads across the whole 10.11.x line.
