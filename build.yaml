name: "DoesTheDogDie"
guid: "4479e434-651e-48f7-a2ee-bec0bdadec5e"
version: "0.3.1.0"
targetAbi: "12.0.0.0"   # default (jf12) artifact; the jf10 artifact declares 10.11.0.0
framework: "net10.0"     # jf12; the jf10 artifact is net9.0
overview: "Per-user content warnings driven by doesthedogdie.com"
description: >
  Surfaces a Safe / Not Safe badge on the Jellyfin item detail page,
  driven by doesthedogdie.com data and the user's configured phobia list.
  Each Jellyfin user picks their own phobia topics; the verdict is
  computed per user, with a strict threshold (any single YES vote on
  any of the user's phobias = Not Safe).
category: "General"
owner: "Zigerus"
artifacts:
- "Jellyfin.Plugin.Dtdd.dll"
changelog: >
  v0.3.0: Jellyfin 12 support. The plugin now ships two builds per release:
  one for Jellyfin 12 (.NET 10) and one for Jellyfin 10.11 (.NET 9). The
  catalog picks the right one for your server automatically. No behaviour
  changes otherwise; cache and phobia lists are kept.
