name: Release Plugin

# Triggers on a 4-part version tag (Jellyfin convention: e.g., v0.1.0.0)
# OR manually via workflow_dispatch with an explicit version.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (4-part, e.g., 0.1.0.0). Will be tagged as v<version>.'
        required: true

permissions:
  contents: write  # need to create releases + commit manifest.json back to main

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Use a token that can push back to main past branch protection (if any).
          # GITHUB_TOKEN is sufficient for public repos without strict protection.
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            # Strip "v" prefix from refs/tags/v0.1.0.0
            VERSION="${GITHUB_REF#refs/tags/v}"
          fi
          # Sanity: must be 4-part
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' is not 4-part numeric (e.g., 0.1.0.0)"
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Setup .NET 9 + 10
        # Two SDKs: the jf10 artifact is net9.0, the jf12 artifact is net10.0.
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Stamp version into Directory.Build.props
        run: |
          sed -i "s|<Version>.*</Version>|<Version>${VERSION}</Version>|" Directory.Build.props
          sed -i "s|<AssemblyVersion>.*</AssemblyVersion>|<AssemblyVersion>${VERSION}</AssemblyVersion>|" Directory.Build.props
          sed -i "s|<FileVersion>.*</FileVersion>|<FileVersion>${VERSION}</FileVersion>|" Directory.Build.props
          cat Directory.Build.props

      - name: Stamp version into build.yaml
        run: |
          sed -i "s|^version:.*|version: \"${VERSION}\"|" build.yaml
          cat build.yaml

      - name: Build Release (both Jellyfin targets)
        # One source, two artifacts. The TargetFramework is conditional on
        # JellyfinTarget, so each build must restore its own assets — a shared
        # `dotnet restore` + `--no-restore` only writes assets for one target
        # and the other build fails on the assets file.
        run: |
          dotnet build Jellyfin.Plugin.Dtdd -c Release --nologo -p:JellyfinTarget=jf12
          dotnet build Jellyfin.Plugin.Dtdd -c Release --nologo -p:JellyfinTarget=jf10
          ls -la Jellyfin.Plugin.Dtdd/bin/Release/net10.0/Jellyfin.Plugin.Dtdd.dll \
                 Jellyfin.Plugin.Dtdd/bin/Release/net9.0/Jellyfin.Plugin.Dtdd.dll

      - name: Extract patch notes from CHANGELOG.md
        # The catalog entry's changelog is what users actually read in
        # Dashboard -> Plugins -> Catalog. It used to be the literal string
        # "v0.2.0.0", which tells them nothing. Pull the matching
        # "## v<version>" section out of CHANGELOG.md instead, and fail the
        # release if it's missing so we can't ship with empty patch notes.
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import os, re
          version = os.environ["VERSION"]
          try:
              text = open("CHANGELOG.md", encoding="utf-8").read()
          except FileNotFoundError:
              raise SystemExit(f"::error::CHANGELOG.md not found; add a '## v{version}' section")

          # Body between this version's heading and the next "## " heading.
          match = re.search(
              rf"^##\s+v{re.escape(version)}\s*$(.*?)(?=^##\s|\Z)",
              text, re.MULTILINE | re.DOTALL)
          if not match or not match.group(1).strip():
              raise SystemExit(
                  f"::error::No '## v{version}' section in CHANGELOG.md. "
                  "Add the patch notes for this release before tagging.")

          print("CHANGELOG_NOTES<<CHANGELOG_EOF")
          print(match.group(1).strip())
          print("CHANGELOG_EOF")
          PY
          echo "Patch notes resolved for $VERSION"

      - name: Package zips + meta.json (one per Jellyfin target)
        run: |
          set -e
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%S")
          echo "TIMESTAMP=$TIMESTAMP" >> "$GITHUB_ENV"

          # target | TFM | targetAbi. The zip name carries the ABI floor so the
          # two artifacts of one version are distinguishable on the Release page.
          for spec in "jf12 net10.0 12.0.0.0" "jf10 net9.0 10.11.0.0"; do
            set -- $spec
            TARGET=$1; TFM=$2; ABI=$3
            STAGING="staging-$TARGET"
            mkdir -p "$STAGING"
            cp "Jellyfin.Plugin.Dtdd/bin/Release/$TFM/Jellyfin.Plugin.Dtdd.dll" "$STAGING/"

            # Pass values via env to the python heredoc (single-quoted PY
            # means shell doesn't interpolate; python reads via os.environ).
            TIMESTAMP="$TIMESTAMP" VERSION="$VERSION" ABI="$ABI" python3 - <<'PY' >"$STAGING/meta.json"
          import json, os
          print(json.dumps({
              "category": "General",
              "changelog": os.environ["CHANGELOG_NOTES"],
              "description": "Per-user content warnings driven by doesthedogdie.com.",
              "guid": "4479e434-651e-48f7-a2ee-bec0bdadec5e",
              "name": "DoesTheDogDie",
              "overview": "Per-user content warnings driven by doesthedogdie.com",
              "owner": "Zigerus",
              "targetAbi": os.environ["ABI"],
              "timestamp": os.environ["TIMESTAMP"],
              "version": os.environ["VERSION"],
          }, indent=2))
          PY

            ZIP="Jellyfin.Plugin.Dtdd_${VERSION}_${ABI%.0}.zip"
            ( cd "$STAGING" && zip -j "../${ZIP}" Jellyfin.Plugin.Dtdd.dll meta.json )
            CHECKSUM=$(md5sum "$ZIP" | awk '{print toupper($1)}')
            SIZE=$(stat -c%s "$ZIP")
            echo "Built $ZIP ($SIZE bytes, md5=$CHECKSUM, targetAbi=$ABI)"
            # Persist per-target values for the manifest + Release steps.
            {
              echo "ZIP_${TARGET}=$ZIP"
              echo "CHECKSUM_${TARGET}=$CHECKSUM"
            } >> "$GITHUB_ENV"
          done

      - name: Update manifest.json
        # Two entries per release, SAME version number, Jellyfin 12 entry
        # FIRST. This ordering is load-bearing: Jellyfin's catalog filters
        # entries to targetAbi <= server version, then sorts by version with
        # OrderByDescending (a stable sort), so entries with equal versions
        # keep manifest order and the server installs the first one. On a 12
        # server both entries survive the filter and the 12 build wins; on
        # 10.11 the 12 entry is filtered out and the 10.11 build is the only
        # candidate. Same shape as JavaScript Injector's manifest.
        run: |
          python3 - <<'PY'
          import json, os
          VERSION = os.environ["VERSION"]
          TIMESTAMP = os.environ["TIMESTAMP"]
          REPO = os.environ["GITHUB_REPOSITORY"]
          TAG = os.environ["TAG"]

          def entry(abi, zip_name, checksum):
              return {
                  "version": VERSION,
                  "changelog": os.environ["CHANGELOG_NOTES"],
                  "targetAbi": abi,
                  "sourceUrl": f"https://github.com/{REPO}/releases/download/{TAG}/{zip_name}",
                  "checksum": checksum,
                  "timestamp": TIMESTAMP,
              }

          new_entries = [
              entry("12.0.0.0", os.environ["ZIP_jf12"], os.environ["CHECKSUM_jf12"]),
              entry("10.11.0.0", os.environ["ZIP_jf10"], os.environ["CHECKSUM_jf10"]),
          ]

          with open("manifest.json") as f:
              data = json.load(f)
          plugin = data[0]
          plugin.setdefault("versions", [])
          # Drop any existing entries for the same version (idempotent re-runs),
          # then prepend both new ones, 12 first.
          plugin["versions"] = [v for v in plugin["versions"] if v.get("version") != VERSION]
          plugin["versions"] = new_entries + plugin["versions"]

          with open("manifest.json", "w") as f:
              json.dump(data, f, indent=2)
              f.write("\n")
          PY
          cat manifest.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: ${{ env.TAG }}
          files: |
            ${{ env.ZIP_jf12 }}
            ${{ env.ZIP_jf10 }}
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Commit updated manifest.json + version stamps back to main
        # Skip the commit-back if we're running on a detached HEAD that
        # wasn't pushed (rare). Normal tag-push case lands here.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json Directory.Build.props build.yaml

          if git diff --cached --quiet; then
            echo "No tracked file changes to commit (manifest unchanged?)"
            exit 0
          fi

          # Land on main — the tag was created from main, so HEAD should be on main.
          # Push directly; for protected branches this needs a PAT instead.
          git commit -m "release ${TAG}"
          git push origin HEAD:main
